[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mikihouse-luyao"
version = "0.21.0"
description = "MIKI HOUSE product scraper and PDF price-list generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=9.0", "reportlab>=4.0", "pypdf>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mikihouse-luyao = "mikihouse_luyao.cli:main"
mikihouse-storefront-sync = "mikihouse_luyao.catalog:main"
mikihouse-stable-sync = "mikihouse_luyao.stable_catalog:main"
mikihouse-sync-cycle = "mikihouse_luyao.stable_sync:main"
mikihouse-initialization-plan = "mikihouse_luyao.initialization_plan:main"
mikihouse-shijiu-duplicate-name-audit = "mikihouse_luyao.shijiu_duplicate_name_audit:main"
mikihouse-sellable-review-audit = "mikihouse_luyao.sellable_review_audit:main"
mikihouse-shijiu-plan = "mikihouse_luyao.shijiu_import:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
