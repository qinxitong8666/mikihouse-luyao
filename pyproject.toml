[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mikihouse-luyao"
version = "0.1.0"
description = "MIKI HOUSE product scraper and PDF price-list generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mikihouse-luyao = "mikihouse_luyao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
